name: My second Github Action learning

on: push

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
    - name: Welcome Message
      run: echo "Welcome to GH-200 learning"
    - name: Checkout Repo
      uses: actions/checkout@v6
    - name: List the files
      run: ls
    - name: Read the file content
      run: cat README.md
  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Second Welcome Message
        run: echo "This is second welcome message
      - name: Read the file contents again
        run: cat README.md


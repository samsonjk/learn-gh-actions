# Build Python CI Pipeline

name: Build Python CI Pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run:  | 
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run tests
        run: pytest
# Demo on Node setup

name: Node Setup

on: push

jobs:
  setup:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for Node Installation
        run: node -v
